<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORN snRNAseq Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{--bg:#ffffff;--bg2:#f5f5f3;--bg3:#ececea;--text:#1a1a18;--text2:#5f5e5a;--text3:#888780;--border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);--radius:8px;--radius-lg:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  @media(prefers-color-scheme:dark){:root{--bg:#1e1e1c;--bg2:#2c2c2a;--bg3:#3a3a38;--text:#f0efe8;--text2:#b4b2a9;--text3:#888780;--border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.22);}}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);padding:24px;max-width:1000px;margin:0 auto;}
  h1{font-size:20px;font-weight:500;margin-bottom:4px;}
  .subtitle{font-size:13px;color:var(--text2);margin-bottom:20px;}
  .subtitle a{color:inherit;text-decoration:underline;}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px;}
  .metric{background:var(--bg2);border-radius:var(--radius);padding:12px 16px;}
  .metric-val{font-size:22px;font-weight:500;}
  .metric-lbl{font-size:11px;color:var(--text3);margin-top:2px;}
  .controls{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center;}
  .tab{padding:6px 14px;border-radius:var(--radius);border:0.5px solid var(--border);background:transparent;cursor:pointer;font-size:13px;color:var(--text2);transition:all 0.15s;}
  .tab.active{background:var(--bg2);color:var(--text);border-color:var(--border2);font-weight:500;}
  .gene-search-wrap{display:none;flex:1;min-width:200px;flex-direction:column;}
  .gene-search-wrap.visible{display:flex;}
  .gene-search{padding:7px 12px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:13px;}
  .gene-hint{font-size:11px;color:var(--text3);margin-top:4px;min-height:16px;}
  .loading-bar{height:2px;background:var(--bg3);border-radius:2px;margin-top:4px;overflow:hidden;display:none;}
  .loading-bar.active{display:block;}
  .loading-bar-inner{height:100%;width:40%;background:#9127F5;border-radius:2px;animation:slide 1s infinite;}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  .layout{display:grid;grid-template-columns:1fr 220px;gap:16px;align-items:start;}
  @media(max-width:700px){.layout{grid-template-columns:1fr;}}
  .chart-wrap{position:relative;width:100%;max-width:600px;aspect-ratio:1;}
  .legend-panel{background:var(--bg2);border-radius:var(--radius-lg);padding:14px;max-height:500px;overflow-y:auto;}
  .legend-title{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px;}
  .leg-item{display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:12px;color:var(--text2);cursor:pointer;}
  .leg-item:hover{color:var(--text);}
  .leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .leg-item.dimmed{opacity:0.3;}
  .expr-scale{width:100%;height:12px;border-radius:4px;margin:8px 0 4px;background:linear-gradient(to right,#D3D1C7,#9127F5);}
  .expr-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);}
  .not-found{font-size:12px;color:var(--text3);padding:4px 0;line-height:1.5;}
</style>
</head>
<body>

<h1>Developing ORN transcriptome</h1>
<p class="subtitle">Explore single-nucleus RNA-seq data profiling <em>Drosophila</em> olfactory receptor neurons (ORNs) across development. Data from <a href="https://drive.google.com/file/d/1ZI9rH9C8wREkVij0DEwKjrnhpJzg6eC3/view?usp=drive_link" target="_blank">Li and Li et al., 2020</a>, <a href="https://drive.google.com/file/d/10zuvPti4wuNOTYWEP0ha1m1jJyspYXLa/view?usp=drive_link" target="_blank">McLaughlin and Brbic et al., 2021</a>.</p>

<div class="controls">

  <button class="tab active" onclick="setView('stage')">Developmental stage</button>
  <button class="tab" onclick="setView('type')">ORN type</button>
  <button class="tab" onclick="setView('gene')">Gene expression</button>
  <div class="gene-search-wrap" id="gene-search-wrap">
    <input class="gene-search" id="gene-search" type="text" placeholder="Search any gene (e.g. acj6, Or47b…)" oninput="onGeneSearch()">
    <div class="loading-bar" id="loading-bar"><div class="loading-bar-inner"></div></div>
    <div class="gene-hint" id="gene-hint"></div>
  </div>
</div>

<div class="layout">
  <div>
    <div class="chart-wrap">
      <canvas id="umap" role="img" aria-label="tSNE plot of 3715 ORN cells colored by developmental stage or ORN type"></canvas>
    </div>
  </div>
  <div>
    <div class="legend-panel" id="legend-panel"></div>
  </div>
</div>

a"],[-9.223,-11.179,"24h","VL1"],[18.22,6.777,"adult","na"],[31.267,-10.222,"48h","DM1"],[-8.432,37.174,"adult","VA1d"],[-31.158,10.648,"adult","DM2"],[-26.032,22.923,"adult","D"],[34.74,-18.926,"48h","VA2"],[-10.959,-27.256,"24h","DL4"],[-6.539,8.246,"adult","unknown_5"],[14.793,15.264,"adult","DP1m"],[1.441,-5.592,"24h","na"],[-37.585,11.16,"adult","DM4"],[22.417,-21.214,"24h","unknown_4"],[36.126,-9.681,"48h","DM2"],[-1.594,-4.985,"24h","VC3"],[14.629,-18.483,"24h","DL4"],[-4.321,-36.609,"48h","unknown_6"],[19.641,18.126,"adult","DP1m"],[-5.53,16.986,"adult","na"],[36.648,7.053,"48h","V"],[-5.835,37.586,"adult","VA1v"],[-3.571,15.596,"adult","VA2"],[-17.968,17.673,"adult","na"],[-39.767,10.179,"adult","DM4"],[20.648,-9.593,"24h","unknown_2"],[-2.528,-4.493,"48h","VC3"],[17.1,-34.426,"24h","unknown_1"],[-28.117,1.022,"adult","DM1"],[12.386,-16.772,"24h","VM5d"],[-4.653,-26.005,"48h","na"],[17.1,-37.459,"48h","unknown_1"],[11.67,-3.77,"48h","unknown_1"],[14.074,-25.103,"48h","DM3*"],[25.099,-8.029,"24h","DM4"],[11.138,-31.676,"48h","unknown_3"],[-31.439,0.56,"adult","DM1"],[-6.16,6.457,"adult","unknown_5"],[9.515,-25.335,"24h","DC3"],[24.336,30.193,"adult","V"],[7.764,-0.795,"24h","na"],[16.422,20.369,"adult","DP1l"],[-29.888,1.302,"adult","DM1"],[7.218,-37.818,"24h","DL4"],[14.899,-34.03,"48h","unknown_4"],[-12.119,-24.426,"24h","VA1v"],[-31.131,5.386,"adult","DM1"],[14.822,-15.545,"24h","na"],[29.981,-23.478,"48h","VM5v"],[-21.722,35.387,"adult","DC1"],[-11.362,-35.715,"48h","DL3"],[-12.136,29.644,"adult","DL3"],[-23.389,8.72,"adult","na"],[-0.877,-34.798,"48h","DL4"],[30.937,-11.522,"48h","DM1"],[1.74,-15.645,"48h","VL2a"],[3.944,-5.541,"24h","na"],[-7.744,7.442,"adult","unknown_5"],[36.506,7.727,"48h","V"],[17.734,17.033,"adult","DP1m"],[5.226,-24.398,"48h","unknown_6"],[-15.804,27.934,"adult","DC1"],[-1.259,-35.924,"48h","DL4"],[-4.436,-27.316,"48h","na"],[-36.652,10.506,"adult","DM4"],[-35.209,9.319,"adult","DM4"],[-40.109,8.617,"adult","DM4"],[25.61,-7.717,"24h","DM4"],[-8.478,-4.11,"48h","VM4"],[28.046,-34.28,"24h","DM3*"],[-22.941,5.518,"adult","DM1"],[16.97,7.874,"adult","na"],[16.411,-34.243,"48h","unknown_4"],[-23.715,19.756,"adult","na"],[27.255,-34.137,"48h","DM2"],[-38.724,7.899,"adult","DM4"],[-20.789,23.022,"adult","DC2"],[-33.728,-0.057,"adult","DM1"],[-12.767,25.673,"adult","DM3*"],[13.87,-19.733,"24h","unknown_3"],[-3.367,6.378,"adult","unknown_5"],[31.887,-28.302,"48h","VM5d"],[-38.971,10.08,"adult","DM4"],[1.992,-10.115,"48h","DP1l"],[-25.124,15.959,"adult","VM3"],[-19.709,19.959,"adult","DL5"],[-32.095,-22.248,"48h","DA1"],[-25.821,15.056,"adult","na"],[-32.175,-0.578,"adult","DM1"],[4.533,-15.842,"24h","VL2a"],[-4.286,-31.896,"48h","DA4l"],[3.769,-35.215,"48h","DM6"],[2.966,-26.999,"48h","DC2"]],"orn_colors":{"D":"#FFFF00","DA1":"#1CE6FF","DA4l":"#FF34FF","DC1":"#FF4A46","DC2":"#008941","DC3":"#006FA6","DL3":"#A30059","DL4":"#FFDBE5","DL5":"#7A4900","DM1":"#0000A6","DM2":"#63FFAC","DM3*":"#B79762","DM4":"#004D43","DM6":"#8FB0FF","DP1l":"#997D87","DP1m":"#5A0007","unknown_1":"#809693","unknown_2":"#6A3A4C","unknown_3":"#1B4400","unknown_4":"#4FC601","unknown_5":"#3B5DFF","unknown_6":"#4A3B53","V":"#FF2F80","VA1d":"#61615A","VA1v":"#BA0900","VA2":"#6B7900","VC3":"#00C2A0","VL1":"#FFAA92","VL2a":"#FF90C9","VM3":"#B903AA","VM4":"#D16100","VM5d":"#DDEFFF","VM5v":"#000035","VP1l":"#7B4F4B","VP4":"#A1C299","na":"#300018"},"expr_max":19.21047019958496};

const cells = META.cells;
const ornColors = META.orn_colors;
const exprMax = META.expr_max;
const stageColors = {'24h':'#00FFF2','48h':'#09FF00','adult':'#9127F5'};
const stageLabels = {'24h':'24h APF','48h':'42h APF','adult':'Adult'};
const stages = ['24h','48h','adult'];
const ornTypes = [...new Set(cells.map(c => c[3]))].filter(t => t !== 'na').sort();

let currentView = 'stage';
let currentGene = null;
let currentExpr = null;
let chart = null;
let hiddenCategories = new Set();
let geneIndex = null;
let chunkCache = {};
let searchTimeout = null;

// Load gene index on page load
fetch('gene_index.json').then(r => r.json()).then(idx => {
  geneIndex = idx;
  document.getElementById('gene-hint').textContent = `${Object.keys(idx).length.toLocaleString()} genes available`;
}).catch(() => {
  document.getElementById('gene-hint').textContent = 'Gene index not loaded — make sure gene_index.json is hosted alongside this file.';
});

function updateMetrics() {
  const sc = {};
  stages.forEach(s => sc[s] = 0);
  cells.forEach(c => { if(sc[c[2]] !== undefined) sc[c[2]]++; });
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-val">${cells.length.toLocaleString()}</div><div class="metric-lbl">Total cells</div></div>
    <div class="metric"><div class="metric-val" style="color:${stageColors['24h']}">${sc['24h']}</div><div class="metric-lbl">24h APF</div></div>
    <div class="metric"><div class="metric-val" style="color:${stageColors['48h']}">${sc['48h']}</div><div class="metric-lbl">42h APF</div></div>
    <div class="metric"><div class="metric-val" style="color:${stageColors['adult']}">${sc['adult']}</div><div class="metric-lbl">Adult</div></div>
  `;
}

function exprColor(val) {
  const t = val / 255;
  const r = Math.round(211 + (145 - 211) * t);
  const g = Math.round(209 + (39 - 209) * t);
  const b = Math.round(199 + (245 - 199) * t);
  return `rgb(${r},${g},${b})`;
}

function colorOf(i) {
  const c = cells[i];
  if (currentView === 'stage') {
    if (hiddenCategories.has(c[2])) return 'rgba(180,178,169,0.08)';
    return stageColors[c[2]] || '#888780';
  }
  if (currentView === 'type') {
    if (c[3] === 'na') return 'rgba(180,178,169,0.08)';
    if (hiddenCategories.has(c[3])) return 'rgba(180,178,169,0.08)';
    return ornColors[c[3]] || '#888780';
  }
  if (currentView === 'gene' && currentExpr) {
    const val = currentExpr[i];
    if (val === 0) return 'rgba(180,178,169,0.2)';
    return exprColor(val);
  }
  return 'rgba(180,178,169,0.3)';
}

function buildChartData() {
  const pts = cells.map((c, i) => ({ x: c[0], y: c[1], idx: i }));
  return {
    datasets: [{
      data: pts,
      backgroundColor: pts.map(pt => colorOf(pt.idx)),
      pointRadius: 2.5,
      pointHoverRadius: 5,
    }]
  };
}

function drawChart() {
  const ctx = document.getElementById('umap').getContext('2d');
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'scatter',
    data: buildChartData(),
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 200 },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const c = cells[ctx.raw.idx];
              const lines = [`Stage: ${stageLabels[c[2]]||c[2]}`, `ORN type: ${c[3]}`];
              if (currentView === 'gene' && currentExpr) {
                const norm = ((currentExpr[ctx.raw.idx] / 255) * exprMax).toFixed(2);
                lines.push(`${currentGene}: ${norm}`);
              }
              return lines;
            },
            title: () => ''
          },
          backgroundColor:'rgba(26,26,24,0.92)',bodyColor:'#b4b2a9',
          padding:10,cornerRadius:6,displayColors:false,bodyFont:{size:12}
        }
      },
      scales: {
        x: { display:true, title:{display:true,text:'tSNE1',color:'#888780',font:{size:11}}, ticks:{display:false}, grid:{display:false} },
        y: { display:true, title:{display:true,text:'tSNE2',color:'#888780',font:{size:11}}, ticks:{display:false}, grid:{display:false} }
      }
    }
  });
}

function refreshChart() {
  if (!chart) return;
  chart.data.datasets[0].backgroundColor = cells.map((_, i) => colorOf(i));
  chart.update('none');
}

function buildLegend() {
  const panel = document.getElementById('legend-panel');
  if (currentView === 'stage') {
    panel.innerHTML = `<div class="legend-title">Developmental stage</div>` +
      stages.map(s => `<div class="leg-item ${hiddenCategories.has(s)?'dimmed':''}" onclick="toggleCat('${s}')">
        <span class="leg-dot" style="background:${stageColors[s]}"></span>${stageLabels[s]}</div>`).join('');
  } else if (currentView === 'type') {
    panel.innerHTML = `<div class="legend-title">ORN type</div>` +
      ornTypes.map(t => `<div class="leg-item ${hiddenCategories.has(t)?'dimmed':''}" onclick="toggleCat('${t}')">
        <span class="leg-dot" style="background:${ornColors[t]||'#888'}"></span>${t}</div>`).join('') +
      `<div class="leg-item" style="opacity:0.35;cursor:default;margin-top:4px;">
        <span class="leg-dot" style="background:#ccc"></span>unassigned</div>`;
  } else {
    if (currentGene && currentExpr) {
      panel.innerHTML = `<div class="legend-title">Expression: ${currentGene}</div>
        <div class="expr-scale"></div>
        <div class="expr-labels"><span>0</span><span>max</span></div>
        <div style="font-size:11px;color:var(--text3);margin-top:8px;">Gray = not expressed</div>`;
    } else {
      panel.innerHTML = `<div class="legend-title">Gene expression</div>
        <div class="not-found">Search any gene name to color the plot by expression level.<br><br>All ${geneIndex ? Object.keys(geneIndex).length.toLocaleString() : '15,906'} genes are searchable.</div>`;
    }
  }
}

function toggleCat(cat) {
  hiddenCategories.has(cat) ? hiddenCategories.delete(cat) : hiddenCategories.add(cat);
  buildLegend(); refreshChart();
}

function setView(view) {
  currentView = view;
  hiddenCategories.clear();
  document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', ['stage','type','gene'][i] === view));
  document.getElementById('gene-search-wrap').classList.toggle('visible', view === 'gene');
  buildLegend(); refreshChart();
}

async function loadGeneExpr(geneName) {
  if (!geneIndex || !(geneName in geneIndex)) return null;
  const chunkNum = geneIndex[geneName];
  if (!chunkCache[chunkNum]) {
    document.getElementById('loading-bar').classList.add('active');
    try {
      const resp = await fetch(`genes_chunk_${chunkNum}.json`);
      chunkCache[chunkNum] = await resp.json();
    } catch(e) {
      document.getElementById('loading-bar').classList.remove('active');
      return null;
    }
    document.getElementById('loading-bar').classList.remove('active');
  }
  const b64 = chunkCache[chunkNum][geneName];
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

function onGeneSearch() {
  clearTimeout(searchTimeout);
  const query = document.getElementById('gene-search').value.trim();
  const hint = document.getElementById('gene-hint');
  if (!query) {
    currentGene = null; currentExpr = null;
    hint.textContent = geneIndex ? `${Object.keys(geneIndex).length.toLocaleString()} genes available` : '';
    buildLegend(); refreshChart(); return;
  }
  if (!geneIndex) { hint.textContent = 'Gene index still loading…'; return; }

  const exact = Object.keys(geneIndex).find(g => g.toLowerCase() === query.toLowerCase());
  const partial = Object.keys(geneIndex).filter(g => g.toLowerCase().startsWith(query.toLowerCase())).slice(0, 6);

  if (exact) {
    hint.textContent = `Loading ${exact}…`;
    searchTimeout = setTimeout(async () => {
      const expr = await loadGeneExpr(exact);
      if (expr) {
        currentGene = exact; currentExpr = expr;
        hint.textContent = `Showing expression for ${exact}`;
        buildLegend(); refreshChart();
      }
    }, 200);
  } else if (partial.length > 0) {
    currentGene = null; currentExpr = null;
    hint.textContent = `Suggestions: ${partial.join(', ')}`;
    buildLegend(); refreshChart();
  } else {
    currentGene = null; currentExpr = null;
    hint.textContent = 'Gene not found';
    buildLegend(); refreshChart();
  }
}

updateMetrics(); drawChart(); buildLegend();
</script>
